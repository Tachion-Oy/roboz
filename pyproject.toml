[project]
name = "roboz"
version = "0.5.0"
description = "Python framework for typed LLM agents with conditional tool chaining."
readme = "README.md"
authors = [{ name = "Tachion Oy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
import-names = ["roboz"]
requires-python = ">=3.13"
keywords = [
    "python",
    "ai-agents",
    "agent-framework",
    "agents",
    "llm",
    "tool-calling",
    "tool-chaining",
    "workflows",
    "multi-agent",
    "openai-compatible",
    "typing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.1",
    "imapclient>=4.1,<5",
    "openai>=2.8.1,<4",
    "pydantic>=2.12.4",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "rich>=14.2.0",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboz"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/roboz",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[project.urls]
Homepage = "https://tachion.fi/"
Repository = "https://github.com/Tachion-Oy/roboz"
Issues = "https://github.com/Tachion-Oy/roboz/issues"
Documentation = "https://github.com/Tachion-Oy/roboz#readme"
Changelog = "https://github.com/Tachion-Oy/roboz/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
addopts = "--cov=roboz --cov-report=term-missing --ignore=tests/type_tests"
python_files = ["test_*.py", "tests_*.py"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["D", "E4", "E7", "E9", "F"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "ruff>=0.5.0",
    "twine>=6.2",
    "urllib3>=2.8.0",
    "httpx>=0.27.0",
]
