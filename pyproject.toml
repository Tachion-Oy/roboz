[project]
name = "roboz"
version = "0.1.2a1"
description = "Typed agents, reusable capabilities, and model catalogues"
readme = "README.md"
authors = [{ name = "Tachion Oy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
import-names = ["roboz"]
requires-python = ">=3.13"
keywords = ["agents", "llm", "tool-calling", "workflows", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.1",
    "openai>=2.8.1,<3",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboz"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/roboz",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[project.urls]
Homepage = "https://github.com/Tachion-Oy/roboz"
Repository = "https://github.com/Tachion-Oy/roboz"
Issues = "https://github.com/Tachion-Oy/roboz/issues"
Documentation = "https://github.com/Tachion-Oy/roboz#readme"

[tool.pytest.ini_options]
addopts = "--cov=roboz --cov-report=term-missing --ignore=tests/type_tests"
python_files = ["test_*.py", "tests_*.py"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["D", "E4", "E7", "E9", "F"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6",
    "pyright>=1.1.411",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "ruff>=0.5.0",
    "twine>=6.2",
    "httpx>=0.27.0",
]
