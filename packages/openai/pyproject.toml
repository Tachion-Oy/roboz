[project]
name = "roboz-openai"
version = "0.1.0a1"
description = "roboz-openai: optional building blocks for Roboz"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Tachion Oy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
import-names = ["roboz_openai"]
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed"]
dependencies = ["roboz>=0.1.1,<0.2.0","openai>=2.8.1,<3"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboz_openai"]

[project.urls]
Repository = "https://github.com/Tachion-Oy/roboz"

[tool.pytest.ini_options]
testpaths = ["tests"]
