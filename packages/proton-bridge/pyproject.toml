[project]
name = "roboz-proton-bridge"
version = "0.1.0b1"
description = "roboz-proton-bridge: optional building blocks for Roboz"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Tachion Oy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
import-names = ["roboz_proton_bridge"]
classifiers = ["Development Status :: 4 - Beta", "Typing :: Typed"]
dependencies = ["roboz>=0.1.1,<0.2.0","roboshed>=0.1.0a1,<0.2.0","pydantic>=2.12.4","pydantic-settings>=2.0,<3"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboz_proton_bridge"]

[project.urls]
Repository = "https://github.com/Tachion-Oy/roboz"

[tool.pytest.ini_options]
testpaths = ["tests"]
