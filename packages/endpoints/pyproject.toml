[project]
name = "roboz-endpoints"
version = "0.1.0a3"
description = "Model catalogues and optional endpoint adapters for Roboz"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Tachion Oy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
import-names = ["roboz_endpoints"]
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed"]
dependencies = ["roboz>=0.1.2.dev2,<0.2.0"]

[project.scripts]
roboz-endpoints = "roboz_endpoints.cli:main"

[project.optional-dependencies]
openai = ["openai>=2.8.1,<3"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboz_endpoints"]

[project.urls]
Repository = "https://github.com/Tachion-Oy/roboz"

[tool.pytest.ini_options]
testpaths = ["tests"]
