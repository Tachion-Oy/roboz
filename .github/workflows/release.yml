name: Release one Python package
on:
  push:
    tags: ['roboz-v*', 'roboshed-v*', 'roboz-endpoints-v*', 'roboz-proton-bridge-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.prepare.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_package.py "$RELEASE_TAG" --check --github-output "$GITHUB_OUTPUT"
  verify:
    needs: preparation
    uses: ./.github/workflows/verify.yml
  select:
    needs: [preparation, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - run: uv sync --locked --dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: candidate-dist
      - name: Test selected wheel with dependencies from PyPI
        env:
          PACKAGE: ${{ needs.preparation.outputs.package }}
        run: uv run pytest tests/distributions --no-cov --dist candidate-dist --package "$PACKAGE" --published-dependencies
      - name: Select the verified wheel and sdist without rebuilding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_package.py "$RELEASE_TAG" --from-dist candidate-dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tagged-package
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: select
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tagged-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
