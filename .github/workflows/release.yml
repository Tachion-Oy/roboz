name: Release one Python package

on:
  push:
    tags:
      - 'roboz-v*'
      - 'roboz-shed-v*'
      - 'roboz-openai-v*'
      - 'roboz-proton-bridge-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --dev
      - name: Validate package and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/release_package.py "$RELEASE_TAG" --check
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run pyright
      - run: bash scripts/run_type_tests.sh
      - run: uv build --all-packages --out-dir dist/verification
      - run: uv run python scripts/check_distributions.py --dist dist/verification
      - name: Build only the tagged package for publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/release_package.py "$RELEASE_TAG"
      - run: uv run twine check dist/release/*
      - uses: actions/upload-artifact@v5
        with:
          name: tagged-package
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: tagged-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
