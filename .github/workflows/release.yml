name: Release one Python package
run-name: Release ${{ inputs.tag }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing package release tag (for example, roboshed-v0.1.0a4)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.prepare.outputs.package }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Require manual invocation from main
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Start this release workflow manually from the main branch.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: prepare
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/release_package.py "$RELEASE_TAG" --resolve
          --base-commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Record the selected release candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE: ${{ steps.prepare.outputs.package }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          printf 'Package: %s\n\nVersion: %s\n\nTag: %s\n\nSource commit: %s\n' \
            "$PACKAGE" "$VERSION" "$RELEASE_TAG" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: preparation
    uses: ./.github/workflows/verify.yml
    with:
      source-sha: ${{ needs.preparation.outputs.sha }}
  select:
    needs: [preparation, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preparation.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: uv sync --locked --dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: candidate-dist
      - name: Test selected wheel with dependencies from PyPI
        env:
          PACKAGE: ${{ needs.preparation.outputs.package }}
        run: uv run pytest tests/distributions --no-cov --dist candidate-dist --package "$PACKAGE" --published-dependencies
      - name: Select the verified wheel and sdist without rebuilding
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release_package.py "$RELEASE_TAG" --from-dist candidate-dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tagged-package
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: select
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tagged-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
