name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  ci:
    name: CI
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
