name: Release validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - run: uv sync --locked --dev
      - run: >-
          uv run pytest --cov=roboz_shed --cov=roboz_openai --cov=roboz_proton_bridge
          --cov-report=xml:reports/coverage.xml --cov-report=json:reports/coverage.json
          --junitxml=reports/pytest.xml
      - run: uv run python scripts/check_coverage.py reports/coverage.json
      - run: uv run python examples/quickstart.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: python-${{ matrix.python }}
          path: reports/
          retention-days: 14
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - run: uv sync --locked --dev
      - run: uv run ruff check
      - run: uv run pyright
      - run: bash scripts/run_type_tests.sh
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - run: uv sync --locked --dev
      - name: Build fresh candidate artifacts
        run: |
          candidate_dir="$(mktemp -d)"
          echo "CANDIDATE_DIR=$candidate_dir" >> "$GITHUB_ENV"
          uv build --no-sources --all-packages --out-dir "$candidate_dir"
      - run: uv run twine check "$CANDIDATE_DIR"/*
      - run: uv run python scripts/check_distributions.py --dist "$CANDIDATE_DIR"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always() && env.CANDIDATE_DIR != ''
        with:
          name: candidate-distributions
          path: ${{ env.CANDIDATE_DIR }}/
          if-no-files-found: error
          retention-days: 14
  portable-core:
    needs: distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: candidate-dist
      - run: python scripts/check_distributions.py --dist candidate-dist --core-only
  downstream:
    needs: distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - name: Extract pinned downstream source
        working-directory: tests/fixtures/robosprawl
        run: |
          sha256sum --check SHA256SUMS
          downstream_dir="$(mktemp -d)"
          tar -xzf source.tar.gz --directory "$downstream_dir"
          echo "DOWNSTREAM_DIR=$downstream_dir" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: candidate-dist
      - run: python scripts/check_downstream.py --source "$DOWNSTREAM_DIR" --dist candidate-dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: downstream-reports
          path: reports/downstream/
          retention-days: 14
